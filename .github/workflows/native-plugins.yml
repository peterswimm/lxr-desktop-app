name: Native plugins

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'rnbo/src/**'
      - 'rnbo/tools/**'
      - 'rnbo/test/**'
      - '.github/workflows/native-plugins.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'rnbo/src/**'
      - 'rnbo/tools/**'
      - 'rnbo/test/**'
      - '.github/workflows/native-plugins.yml'
  workflow_dispatch:

jobs:
  firmware:
    name: Native port matches the firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated sources are up to date
        run: |
          python3 rnbo/tools/build.py
          python3 native/tools/codebox2cpp.py
          git diff --exit-code rnbo/generated native/generated
      - name: Engine against the firmware
        run: node rnbo/test/run.mjs --native
      - name: Sequencer against the firmware
        run: node rnbo/test/seqref.mjs --native

  # Linux, on GitHub and on the Forgejo this repository also lives on. There, ubuntu-latest
  # is the node:20-bookworm image, run as root, without CMake or Rust: they are installed
  # when missing, which on GitHub's image they are not.
  plugins-linux:
    name: CLAP and VST3 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          if ! command -v cmake >/dev/null; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends cmake g++ make
          fi
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cmake --version | head -1
      - name: Configure
        run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Host test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: clap-validator
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator clap-validator
          clap-validator validate build/plugins/LXR.clap
      - uses: actions/upload-artifact@v4
        with:
          name: LXR-${{ runner.os }}
          path: build/plugins

  # macOS and Windows: GitHub's runners only. The Forgejo has none for these labels, and a
  # job asking for one there waits for ever.
  plugins:
    name: CLAP and VST3 (${{ matrix.os }})
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Host test
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: LXR-${{ runner.os }}
          path: build/plugins
